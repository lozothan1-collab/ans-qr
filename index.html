<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ANS QR</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f3f5f4;
  margin:0;
  padding:16px;
}
.box{
  max-width:500px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:18px;
}
h2{text-align:center}
#reader{width:100%}
button{
  width:100%;
  padding:16px;
  margin-top:15px;
  border:0;
  border-radius:12px;
  background:#16804b;
  color:white;
  font-size:18px;
  font-weight:bold;
}
input[type="number"]{
  width:100%;
  padding:15px;
  font-size:22px;
  box-sizing:border-box;
  border:1px solid #ccc;
  border-radius:10px;
}
.options{
  display:flex;
  gap:8px;
  margin-top:8px;
}
label{
  flex:1;
  text-align:center;
  padding:12px 5px;
  border:1px solid #ccc;
  border-radius:10px;
}
#form{display:none}
.title{
  margin-top:18px;
  margin-bottom:7px;
  font-weight:bold;
}
#qr{
  background:#eee;
  padding:10px;
  border-radius:8px;
  word-break:break-all;
}
.status{
  text-align:center;
  margin-top:12px;
}
</style>
</head>

<body>

<div class="box">

<h2>📷 ANS QR</h2>

<div id="scan">

  <div id="reader"></div>

  <div id="cameraStatus" class="status">
    ກົດປຸ່ມເພື່ອເປີດກ້ອງ
  </div>

  <button onclick="startCamera()">
    📷 ເປີດກ້ອງ
  </button>

</div>


<div id="form">

  <div class="title">ລະຫັດ QR</div>
  <div id="qr"></div>

  <div class="title">ລາຄາ</div>
  <input id="price" type="number" inputmode="decimal" placeholder="0">

  <div class="title">ສະກຸນເງິນ</div>

  <div class="options">
    <label>
      <input type="radio" name="currency" value="LAK" checked>
      ກີບ
    </label>

    <label>
      <input type="radio" name="currency" value="THB">
      ບາດ
    </label>

    <label>
      <input type="radio" name="currency" value="USD">
      ໂດລາ
    </label>
  </div>


  <div class="title">ການຊຳລະ</div>

  <div class="options">
    <label>
      <input type="radio" name="payment" value="ເງິນສົດ" checked>
      💵 ເງິນສົດ
    </label>

    <label>
      <input type="radio" name="payment" value="ເງິນໂອນ">
      📱 ເງິນໂອນ
    </label>
  </div>

  <button id="saveButton" onclick="saveData()">
    ບັນທຶກ
  </button>

  <div id="saveStatus" class="status"></div>

</div>

</div>


<script>

const API =
"https://script.google.com/macros/s/AKfycbyMm6KyuKLwu6miWRo_Z46jBwohl3D8gjxpqUBrET_pUXAbUBrs6zd5QdHMQLGivPShew/exec";

let scanner = null;
let qrCode = "";
let locked = false;


async function startCamera(){

  const status = document.getElementById("cameraStatus");

  try{

    scanner = new Html5Qrcode("reader");

    await scanner.start(
      {facingMode:"environment"},
      {fps:10,qrbox:250},
      onScan
    );

    status.innerText = "ນຳ QR ເຂົ້າໃນກອບ";

  }catch(err){

    status.innerText = "❌ " + err;

  }
}


async function onScan(text){

  if(locked) return;

  locked = true;
  qrCode = text;

  try{
    await scanner.stop();
  }catch(e){}

  document.getElementById("qr").innerText = qrCode;
  document.getElementById("scan").style.display = "none";
  document.getElementById("form").style.display = "block";
}


function saveData(){

  const price = document.getElementById("price").value;

  if(price === ""){
    alert("ກະລຸນາໃສ່ລາຄາ");
    return;
  }

  const currency =
    document.querySelector('input[name="currency"]:checked').value;

  const payment =
    document.querySelector('input[name="payment"]:checked').value;

  const status = document.getElementById("saveStatus");
  const button = document.getElementById("saveButton");

  status.innerText = "ກຳລັງບັນທຶກ...";
  button.disabled = true;

  const url =
    API +
    "?qr=" + encodeURIComponent(qrCode) +
    "&price=" + encodeURIComponent(price) +
    "&currency=" + encodeURIComponent(currency) +
    "&payment=" + encodeURIComponent(payment) +
    "&t=" + Date.now();

 fetch(url, {
  method: "GET",
  mode: "no-cors"
})
.then(function() {
  status.innerText = "✅ ບັນທຶກສຳເລັດ";
  button.innerText = "✓ ສຳເລັດ";

  setTimeout(function() {
    location.reload();
  }, 1500);
})
.catch(function(error) {
  status.innerText = "❌ ບັນທຶກບໍ່ສຳເລັດ";
  button.disabled = false;
});
}

</script>

</body>
</html>
